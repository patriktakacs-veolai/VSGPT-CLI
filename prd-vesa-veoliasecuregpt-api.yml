  /oauth/login:
    get:
      tags:
        - OAuth
      summary: Oauth Login
      description: |-
        Start the Google OAuth flow.

        Returns ``{ "auth_url": "..." }`` — the frontend opens this URL.

        **With callback mode** (``OAUTH_GOOGLE_CALLBACK_URL`` is set):
        Google redirects to a single public callback endpoint that exchanges the
        code and redirects the browser back to ``redirect_uri`` with tokens in the
        URL fragment.  Only the callback URL needs to be registered in Google
        Cloud Console.

        **Without callback mode** (legacy):
        Google redirects directly to ``redirect_uri`` (which must be registered in
        Google Cloud Console).  The frontend then calls ``POST /oauth/token``.
      operationId: oauth_login_oauth_login_get
      parameters:
        - name: scopes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            default:
              - https://www.googleapis.com/auth/userinfo.profile
              - https://www.googleapis.com/auth/userinfo.email
              - https://www.googleapis.com/auth/bigquery.readonly
              - https://www.googleapis.com/auth/devstorage.read_only
              - https://www.googleapis.com/auth/bigquery.insertdata
              - https://www.googleapis.com/auth/drive.readonly
              - https://www.googleapis.com/auth/drive.file
              - https://www.googleapis.com/auth/gmail.compose
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/calendar
              - https://www.googleapis.com/auth/directory.readonly
              - https://www.googleapis.com/auth/contacts.readonly
              - https://www.googleapis.com/auth/chat.spaces.readonly
              - https://www.googleapis.com/auth/chat.memberships.readonly
              - https://www.googleapis.com/auth/chat.messages.readonly
              - https://www.googleapis.com/auth/chat.messages.create
              - https://www.googleapis.com/auth/chat.users.readstate.readonly
              - https://www.googleapis.com/auth/maps-platform.mapstools
            title: Scopes
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            title: Redirect Uri
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Oauth Token
      description: |-
        Exchange an authorization code for tokens.

        The frontend extracts ``code`` from the Google redirect URL and sends it
        here along with the same ``redirect_uri`` used in ``/oauth/login``.
      operationId: oauth_token_oauth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/refresh:
    post:
      tags:
        - OAuth
      summary: Oauth Refresh
      description: Exchange a refresh_token for a new set of tokens.
      operationId: oauth_refresh_oauth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_oauth_refresh_oauth_refresh_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
